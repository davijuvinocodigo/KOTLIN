# banco de dados
spring:
  datasource:
    url: jdbc:h2:mem:livros_db
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jackson:
    default-property-inclusion: non_null    



# swagger-ui
springdoc:
  swagger-ui:
    operations-sorter: method
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs     
